# =============================================================
# Scenario: Fast Target
# =============================================================
# The target moves quickly enough that formation and navigation pull against each other, so spacing stretches then recovers.
# =============================================================


scenario_name: "fast-target"
scenario_description: "A target that moves faster than the lattice can hold"

num_agents: 40
epsilon: 50.0
sigma: 16.0
target_gain: 2.5
damping: 2.5
steps: 600
dt: 0.08

target_amp_x: 80.0
target_amp_y: 60.0
target_freq_x: 0.008
target_freq_y: 0.005
