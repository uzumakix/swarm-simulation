# =============================================================
# Scenario: Drifting Target
# =============================================================
# Default preset. Agents launch from one point and settle into a lattice while following a target on a slow Lissajous path.
# =============================================================


scenario_name: "drifting-target"
scenario_description: "Follow a slowly drifting target, the default demonstration"

num_agents: 50
epsilon: 80.0
sigma: 12.0
target_gain: 1.2
damping: 2.0
steps: 600
dt: 0.08

target_amp_x: 70.0
target_amp_y: 50.0
target_freq_x: 0.004
target_freq_y: 0.006
